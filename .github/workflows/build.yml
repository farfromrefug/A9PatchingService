name: patched image (image + apk + daemon)

# Full build: compiles the daemon and the settings app from source, patches them into the GSI
# and produces a flashable image. Use the quick build when only the apk or the daemon changed.

on:
  workflow_dispatch:
    inputs:
      upload_image:
        description: 'Upload system_patched.img as an artifact (several GB, slow)'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
          
      - run: java --version
  
      - run: |
          sudo apt install apktool attr
          cp app/external_scripts/system_img_patcher/apktool /usr/local/bin

      # Compile the daemon from source rather than baking in the committed blob, so the image
      # always matches eink_daemon.c.
      - name: Build e-ink daemon
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          "$ndk/ndk-build" -C app/external_scripts/root_service \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-27 \
            NDK_OUT=obj NDK_LIBS_OUT=libs
          # NDK_LIBS_OUT holds the stripped binary; the obj tree keeps the unstripped one.
          cp app/external_scripts/root_service/libs/arm64-v8a/a9_eink_server \
             app/external_scripts/system_img_patcher/a9_eink_server
          file app/external_scripts/system_img_patcher/a9_eink_server

      # Rebuild a9service.apk from source so the image and the downloadable APK are
      # the same build, signed with the same key. Without the keystore secret we keep
      # using the committed blob, since a debug-signed APK could not update it anyway.
      - name: Decode release keystore
        id: keystore
        env:
          A9_KEYSTORE_BASE64: ${{ secrets.A9_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$A9_KEYSTORE_BASE64" ]; then
            echo "No A9_KEYSTORE_BASE64 secret set, keeping the committed a9service.apk." >&2
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "$A9_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed a9service.apk
        if: steps.keystore.outputs.available == 'true'
        env:
          A9_KEYSTORE: ${{ runner.temp }}/release.jks
          A9_KEYSTORE_PASSWORD: ${{ secrets.A9_KEYSTORE_PASSWORD }}
          A9_KEY_ALIAS: ${{ secrets.A9_KEY_ALIAS }}
          A9_KEY_PASSWORD: ${{ secrets.A9_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk \
             app/external_scripts/system_img_patcher/a9service.apk

      - name: Show APK signer
        if: steps.keystore.outputs.available == 'true'
        run: |
          build_tools="$(printf '%s\n' "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs \
            app/external_scripts/system_img_patcher/a9service.apk

      - run:  echo "LOS_BUILD=lineage-21.0-20250222-UNOFFICIAL-arm64_bvN.img" >> $GITHUB_ENV
      - run:  echo "APK_TOOL_VERSION=apktool_2.11.0" >> $GITHUB_ENV
      
      - run: |
          wget --quiet https://sourceforge.net/projects/andyyan-gsi/files/lineage-21-td/${{ env.LOS_BUILD }}.gz

      - run: |
          gzip -d ${{ env.LOS_BUILD }}.gz

      - run: |
          cd app/external_scripts/system_img_patcher
          sudo APK_TOOL=$(pwd)/${{ env.APK_TOOL_VERSION }}.jar ./patch_system_img.sh $(pwd)/../../../${{ env.LOS_BUILD }}

      - uses: actions/upload-artifact@v4
        with:
          name: hisensea9_magisk_module
          path: |
            app/external_scripts/system_img_patcher/hisensea9_magisk_module.zip
          retention-days: 30
          if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`

      # Same APK and daemon that went into the image, published on their own so both can be
      # updated on an already patched phone without reflashing.
      - uses: actions/upload-artifact@v4
        with:
          name: a9service_apk
          path: |
            app/external_scripts/system_img_patcher/a9service.apk
          retention-days: 30
          if-no-files-found: error

      - name: Package daemon Magisk module
        run: |
          app/external_scripts/system_img_patcher/make_magisk_module.sh \
            --daemon app/external_scripts/system_img_patcher/a9_eink_server \
            --out a9_eink_daemon_module.zip \
            --version "run-${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: a9_eink_daemon
          path: |
            app/external_scripts/system_img_patcher/a9_eink_server
            a9_eink_daemon_module.zip
          retention-days: 30
          if-no-files-found: error

      # ~4 GB even after resize2fs -M, so it is opt-in.
      - uses: actions/upload-artifact@v4
        if: inputs.upload_image
        with:
          name: system_patched_img
          path: app/external_scripts/system_img_patcher/system_patched.img
          retention-days: 7
          if-no-files-found: error