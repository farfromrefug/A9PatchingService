name: quick build (apk + daemon + magisk module)

# Everything that can be updated on an already-patched phone, without reflashing:
#   a9service.apk               -> adb install -r
#   a9_eink_daemon_module.zip   -> flash in Magisk, reboot
# Takes about a minute. Use the "patched image" workflow when vndk.rc or the image itself changes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Attach the artifacts to a GitHub release with this tag (empty = artifacts only)'
        required: false
        default: ''
  push:
    tags:
      - 'app-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Signing key of the a9service.apk baked into the published images. An APK signed with
      # anything else is rejected as INSTALL_FAILED_UPDATE_INCOMPATIBLE on an existing install,
      # so the build fails rather than publishing something nobody can install. Override with
      # the A9_EXPECTED_CERT_SHA256 repository variable if the key is ever rotated.
      EXPECTED_CERT_SHA256: >-
        ${{ vars.A9_EXPECTED_CERT_SHA256 ||
        '50c3301e181970be7d50b4cd51e44060db6876ebf6adb02e48336db4048e5757' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build e-ink daemon
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          "$ndk/ndk-build" -C app/external_scripts/root_service \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-27 \
            NDK_OUT=obj NDK_LIBS_OUT=libs
          mkdir -p dist
          # NDK_LIBS_OUT holds the stripped binary; the obj tree keeps the unstripped one.
          cp app/external_scripts/root_service/libs/arm64-v8a/a9_eink_server dist/a9_eink_server
          file dist/a9_eink_server

      - name: Decode release keystore
        env:
          A9_KEYSTORE_BASE64: ${{ secrets.A9_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$A9_KEYSTORE_BASE64" ]; then
            echo "::error::A9_KEYSTORE_BASE64 is not set. Without the original key the APK cannot update an installed build."
            exit 1
          fi
          echo "$A9_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          A9_KEYSTORE: ${{ runner.temp }}/release.jks
          A9_KEYSTORE_PASSWORD: ${{ secrets.A9_KEYSTORE_PASSWORD }}
          A9_KEY_ALIAS: ${{ secrets.A9_KEY_ALIAS }}
          A9_KEY_PASSWORD: ${{ secrets.A9_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Check signature and version
        id: apk
        run: |
          set -euo pipefail
          build_tools="$(printf '%s\n' "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk

          # Written to files rather than piped: `grep -m1` and `head -1` exit early, which
          # would SIGPIPE the producer and trip pipefail.
          "$build_tools/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"

          actual="$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')"
          expected="$(echo "$EXPECTED_CERT_SHA256" | tr -d '[:space:]')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Signing key mismatch. Expected $expected, got $actual. This APK could not update an installed build."
            exit 1
          fi

          "$build_tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          badging="$(head -1 "$RUNNER_TEMP/badging.txt")"
          version_name="$(echo "$badging" | sed -E "s/.*versionName='([^']*)'.*/\1/")"
          version_code="$(echo "$badging" | sed -E "s/.*versionCode='([^']*)'.*/\1/")"
          echo "Built a9service $version_name (versionCode $version_code)"

          mkdir -p dist
          # Kept as a9service.apk, since that is the name the image patcher expects.
          cp "$apk" dist/a9service.apk
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Package daemon Magisk module
        run: |
          app/external_scripts/system_img_patcher/make_magisk_module.sh \
            --daemon dist/a9_eink_server \
            --out dist/a9_eink_daemon_module.zip \
            --version "${{ steps.apk.outputs.version_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: a9-quick-${{ steps.apk.outputs.version_name }}-${{ steps.apk.outputs.version_code }}
          path: |
            dist/a9service.apk
            dist/a9_eink_server
            dist/a9_eink_daemon_module.zip
          retention-days: 90
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Settings app ${{ steps.apk.outputs.version_name }}" \
              --notes "No reflash needed on an already patched phone.

          - \`a9service.apk\` - \`adb install -r a9service.apk\`
          - \`a9_eink_daemon_module.zip\` - flash in Magisk, then reboot"
          fi
          gh release upload "$TAG" \
            dist/a9service.apk \
            dist/a9_eink_daemon_module.zip \
            --clobber
